[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "envkeep"
version = "0.1.0"
description = "Check, sync, and document your .env files against .env.example"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12",
    "python-dotenv>=1.0",
    "rich>=13",
    "pyyaml>=6",
]

[project.scripts]
envkeep = "envkeep.cli:app"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]